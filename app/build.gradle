plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autoreels.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.autoreels.pro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero heavy dependencies to ensure ultra-fast and error-free compilation
}
